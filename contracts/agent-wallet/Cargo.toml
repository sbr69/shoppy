[package]
name = "jarvis-agent-wallet"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
jarvis-policy-interface = { path = "../policy-interface" }

[dev-dependencies]
jarvis-trust-list = { path = "../trust-list" }
soroban-sdk = { workspace = true, features = ["testutils"] }
