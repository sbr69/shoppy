<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Copper/Terracotta gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9684f" />
      <stop offset="100%" stop-color="#803f2f" />
    </linearGradient>
    
    <!-- Metallic gold/light copper gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6cca8" />
      <stop offset="50%" stop-color="#d6b58b" />
      <stop offset="100%" stop-color="#a07d57" />
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer circular frame -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.4" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.6" />

  <g filter="url(#shadow)">
    <!-- Iron Man / Robotic Helmet Profile on the Left -->
    <path d="M 220,95 C 170,95 120,135 100,195 C 80,255 85,325 120,375 C 145,410 180,425 220,425 L 210,395 C 180,395 155,380 140,350 C 115,305 110,245 125,195 C 140,145 180,115 220,115 Z" fill="url(#goldGrad)" />

    <!-- Helmet details (cheeks, jaw, ear element) -->
    <path d="M 125,275 L 165,270 C 175,270 180,275 180,285 C 180,305 160,335 145,360 L 115,340 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 120,295 C 130,295 145,305 150,315 C 155,325 150,335 140,345 L 130,335 Z" fill="none" stroke="#fff" stroke-width="3" opacity="0.5" />

    <!-- Stylized eye slot -->
    <path d="M 115,255 L 195,235 L 205,250 L 125,270 Z" fill="#fff" opacity="0.95" />
    <path d="M 115,255 L 195,235 L 205,250 L 125,270 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Stylized Letter 'P' on the Right -->
    <path d="M 237,117 L 375,117 C 440,117 440,245 375,245 L 282,245 L 282,395 C 282,410 270,425 255,425 C 240,425 237,410 237,395 Z" fill="url(#terracottaGrad)" />

    <!-- Inner counter space of 'P' -->
    <path d="M 282,152 L 365,152 C 395,152 395,210 365,210 L 282,210 Z" fill="#ffffff" />

    <!-- Dynamic speed lines / accent lines below P -->
    <rect x="290" y="300" width="160" height="8" rx="4" fill="url(#goldGrad)" opacity="0.8" />
    <rect x="290" y="320" width="130" height="8" rx="4" fill="url(#goldGrad)" opacity="0.6" />
    <rect x="290" y="340" width="80" height="8" rx="4" fill="url(#goldGrad)" opacity="0.4" />
  </g>
</svg>
